{% extends "base.html" %}
{% block content %}
{% if validlink %}
<h1>Choose a new password</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change password</button>
</form>
{% else %}
<h1>This link is not valid</h1>
<p>It may have expired or been used already. <a href="{% url 'accounts:password_reset' %}">Request a new one</a>.</p>
{% endif %}
{% endblock %}
