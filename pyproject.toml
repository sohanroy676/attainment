[project]
name = "attainment"
version = "0.1.0"
description = "Free, configurable OBE CO/PO attainment automation for colleges."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "django-axes>=7.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "python-dotenv>=1.0",
    "argon2-cffi>=25.1.0",
    "django-csp>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/prototype"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine"]
exclude = ["docs/prototype"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["engine", "apps", "config", "tests"]
addopts = "-ra --strict-markers --ds=config.settings.test"
markers = [
    "unit: pure unit tests",
    "golden: reference results from the mentor workbooks (never edit to pass)",
    "property: Hypothesis property tests",
    "integration: needs the database",
    "isolation: college isolation (RLS) tests",
    "e2e: Playwright browser tests",
    "perf: performance tests",
    "ops: backup/restore and deployment checks",
]
