# Local and self-hosted stack: PostgreSQL 16, the app, a one-shot migration job and Caddy.
# Copy .env.example to .env first (see README). Start with: docker compose up --build

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
  POSTGRES_DB: ${POSTGRES_DB:-attainment}
  DB_HOST: db
  DB_PORT: "5432"
  DB_APP_USER: ${DB_APP_USER:-attainment_app}
  DB_OWNER_USER: ${DB_OWNER_USER:-attainment_owner}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-attainment@localhost}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-attainment}
      DB_OWNER_USER: ${DB_OWNER_USER:-attainment_owner}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      DB_APP_USER: ${DB_APP_USER:-attainment_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-attainment}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations as the owner role, then exits. The web app never sees the owner password.
  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--database", "owner", "--noinput"]
    environment:
      <<: *app-env
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
